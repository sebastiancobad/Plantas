version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://chemscale:chemscale@db:5432/chemscale
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DEBUG=true
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
      - redis

  # ── Celery Worker (heavy computations) ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: celery -A app.worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://chemscale:chemscale@db:5432/chemscale
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
      - redis

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chemscale
      POSTGRES_PASSWORD: chemscale
      POSTGRES_DB: chemscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Redis (cache + message broker) ─────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
